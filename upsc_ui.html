<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPSC RAG — Ask a Question</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0f1a;
      --surface: #161929;
      --border: #252840;
      --accent: #5b6ef5;
      --accent-glow: rgba(91, 110, 245, 0.25);
      --text: #e8eaf6;
      --text-muted: #8b92b8;
      --success: #4caf7d;
      --danger: #f55b5b;
      --ca: #f0b429;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }
    header .badge {
      display: inline-block;
      background: var(--accent-glow);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a0a8ff 0%, #5b6ef5 50%, #c77dff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      width: 100%;
      max-width: 760px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      background: #0d0f1a;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      padding: 14px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      min-height: 120px;
      resize: vertical;
      line-height: 1.6;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .field { margin-bottom: 20px; }

    .mode-indicator {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mode-pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      cursor: pointer;
      transition: all 0.18s;
      background: transparent;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
    }
    .mode-pill:hover { border-color: var(--accent); color: var(--accent); }
    .mode-pill.active[data-mode="prelims"]         { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
    .mode-pill.active[data-mode="mains"]           { border-color: var(--success); color: var(--success); background: rgba(76,175,125,0.12); }
    .mode-pill.active[data-mode="current_affairs"] { border-color: var(--ca); color: var(--ca); background: rgba(240,180,41,0.12); }

    button#askBtn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #5b6ef5 0%, #8b5cf6 100%);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(91, 110, 245, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    button#askBtn:hover:not(:disabled) { opacity: 0.92; box-shadow: 0 6px 30px rgba(91,110,245,0.5); }
    button#askBtn:active:not(:disabled) { transform: scale(0.98); }
    button#askBtn:disabled { opacity: 0.55; cursor: not-allowed; }

    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #answerSection {
      margin-top: 32px;
      display: none;
    }
    .answer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .answer-header h2 {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .routing-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid;
    }
    .routing-badge.web    { border-color: var(--ca); color: var(--ca); }
    .routing-badge.vector { border-color: var(--success); color: var(--success); }
    .routing-badge.cache  { border-color: #f5a623; color: #f5a623; margin-left: 6px; }

    .answer-box {
      background: #0d0f1a;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 20px 22px;
      font-size: 0.95rem;
      line-height: 1.9;
      color: var(--text);
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease;
    }
    .answer-box.gated {
      border-color: var(--danger);
      color: var(--danger);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .meta-row {
      display: flex;
      gap: 20px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .meta-item {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .meta-item strong { color: var(--text); }

    .error-box {
      background: rgba(245, 91, 91, 0.1);
      border: 1.5px solid var(--danger);
      border-radius: 10px;
      padding: 14px 18px;
      color: var(--danger);
      font-size: 0.9rem;
      margin-top: 16px;
      display: none;
    }

    footer {
      margin-top: 48px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(12px); }
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">UPSC RAG System</div>
    <h1>Ask Your UPSC Question</h1>
    <p>Hybrid Vector + Live Web Search &middot; Anti-Hallucination Layer</p>
  </header>

  <div class="card">

    <div class="field">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <label>Your Question</label>
        <a href="#" onclick="resetConversation(event)" style="color: #5b6ef5; font-size: 0.85em; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;">
          <span>🔄</span> Clear History
        </a>
      </div>
      <textarea id="queryInput" placeholder="e.g. What is the current status of ISRO's Gaganyaan mission?"></textarea>
    </div>

    <div class="field">
      <label>Answer Mode</label>
      <div class="mode-indicator">
        <button class="mode-pill active" data-mode="prelims">&#128221; Prelims</button>
        <button class="mode-pill" data-mode="mains">&#128196; Mains</button>
        <button class="mode-pill" data-mode="current_affairs">&#127760; Current Affairs</button>
      </div>
      <input type="hidden" id="modeInput" value="prelims" />
    </div>

    <button id="askBtn" onclick="askQuestion()">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Ask Question</span>
    </button>

    <div class="error-box" id="errorBox"></div>

    <div id="answerSection">
      <div class="answer-header">
        <h2>Answer</h2>
        <span class="routing-badge" id="routingBadge"></span>
      </div>
      <div class="answer-box" id="answerBox"></div>
      <div class="meta-row" id="metaRow"></div>
    </div>

  </div>

  <footer>UPSC RAG &middot; <span id="apiEndpointText">/api/v1/query</span> &middot; Press Ctrl+Enter to submit</footer>

  <script>
    const API_URL = (window.location.protocol === 'file:' || !window.location.host)
      ? "http://localhost:8000/api/v1/query"
      : "/api/v1/query";

    // Update footer with the active API endpoint
    document.getElementById('apiEndpointText').textContent = API_URL.replace("http://", "");

    document.querySelectorAll('.mode-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.mode-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        document.getElementById('modeInput').value = pill.dataset.mode;
      });
    });

    async function askQuestion() {
      const query = document.getElementById('queryInput').value.trim();
      const mode  = document.getElementById('modeInput').value;

      if (!query) { showError("Please enter a question first."); return; }

      setLoading(true);
      hideError();
      document.getElementById('answerSection').style.display = 'none';

      // Retrieve or generate session_id
      let sessionId = sessionStorage.getItem('upsc_rag_session_id');
      if (!sessionId) {
        sessionId = 'session_' + Math.random().toString(36).substring(2, 15);
        sessionStorage.setItem('upsc_rag_session_id', sessionId);
      }

      try {
        const resp = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, mode, session_id: sessionId }),
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.detail || "Server error " + resp.status);
        }

        const data = await resp.json();
        showAnswer(data);
      } catch (err) {
        showError(err.message || "Could not reach the API. Is the server running on localhost:8000?");
      } finally {
        setLoading(false);
      }
    }

    function resetConversation(e) {
      if (e) e.preventDefault();
      const newSessionId = 'session_' + Math.random().toString(36).substring(2, 15);
      sessionStorage.setItem('upsc_rag_session_id', newSessionId);
      document.getElementById('queryInput').value = "";
      document.getElementById('answerSection').style.display = 'none';
      hideError();
      const notification = document.createElement('div');
      notification.style.cssText = 'position:fixed; bottom:20px; right:20px; background:#5b6ef5; color:white; padding:12px 24px; border-radius:8px; font-weight:600; box-shadow:0 10px 30px rgba(91,110,245,0.3); z-index:10000; animation: fadeUp 0.3s ease;';
      notification.textContent = "New conversation session started!";
      document.body.appendChild(notification);
      setTimeout(() => {
        notification.style.animation = 'fadeDown 0.3s ease';
        setTimeout(() => notification.remove(), 300);
      }, 2500);
    }

    function showAnswer(data) {
      const section   = document.getElementById('answerSection');
      const answerBox = document.getElementById('answerBox');
      const badge     = document.getElementById('routingBadge');
      const metaRow   = document.getElementById('metaRow');

      const routing = data.routing || "";
      if (routing.includes("web") || routing.includes("current")) {
        badge.textContent = "Live Web Search";
        badge.className   = "routing-badge web";
      } else {
        badge.textContent = "Vector DB";
        badge.className   = "routing-badge vector";
      }

      // Show ⚡ Cached badge when response came from cache
      let cacheBadge = document.getElementById('cacheBadge');
      if (!cacheBadge) {
        cacheBadge = document.createElement('span');
        cacheBadge.id = 'cacheBadge';
        badge.parentNode.insertBefore(cacheBadge, badge.nextSibling);
      }
      if (data.cache_hit) {
        cacheBadge.textContent = "⚡ Cached";
        cacheBadge.className   = "routing-badge cache";
        cacheBadge.style.display = 'inline-block';
      } else {
        cacheBadge.style.display = 'none';
      }

      if (data.gated) {
        answerBox.textContent = "No sufficient information found: " + (data.gate_reason || "");
        answerBox.className   = "answer-box gated";
      } else {
        let formatted = (data.answer || "No answer returned.");
        formatted = formatted.replace(/\[([^\]]+)\]/g, '<span style="color:#5b6ef5;font-size:0.8em;font-weight:600;">[$1]</span>');
        answerBox.innerHTML = formatted;
        answerBox.className = "answer-box";
      }

      const conf   = ((data.confidence || 0) * 100).toFixed(0);
      const chunks = (data.chunks || []).length;
      const cites  = (data.citations || []).length;

      metaRow.innerHTML =
        '<span class="meta-item">Mode: <strong>' + formatMode(data.mode) + '</strong></span>' +
        '<span class="meta-item">Confidence: <strong>' + conf + '%</strong></span>' +
        '<span class="meta-item">Chunks: <strong>' + chunks + '</strong></span>' +
        (cites ? '<span class="meta-item">Citations: <strong>' + cites + '</strong></span>' : '') +
        '<span class="meta-item">Answered: <strong>' + (data.answered ? 'Yes' : 'No') + '</strong></span>' +
        (data.cache_hit ? '<span class="meta-item" style="color:#f5a623;">⚡ <strong>Instant Cache</strong></span>' : '');

      section.style.display = 'block';
    }

    function formatMode(mode) {
      if (!mode) return '';
      return mode.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    }

    function setLoading(state) {
      const btn     = document.getElementById('askBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');
      btn.disabled          = state;
      spinner.style.display = state ? 'block' : 'none';
      btnText.textContent   = state ? 'Searching...' : 'Ask Question';
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent   = msg;
      box.style.display = 'block';
    }
    function hideError() {
      document.getElementById('errorBox').style.display = 'none';
    }

    document.getElementById('queryInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) askQuestion();
    });
  </script>
</body>
</html>
